<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App | BurgerHouse</title>
    <link rel="icon" href="./assets/logo/Logo 02.png">
    <link rel="stylesheet" href="./style.css?v=123" />
    <script src="./script.js?v=123" defer></script>

</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
         <img class="brand-logo" src="./assets/logo/Logo 02.png" alt="Bestell-App Logo" />
         <button class="icon-button" aria-label="Menü öffnen">
           <img src="./assets/logo/menu.png" alt="" />
         </button>
        </div>
    </header>
    <main>
      <section class="restaurant-hero">
        <img class="hero-image" src="./assets/img/hero photo.png.jpg" alt="Burger und Pizza auf einem Tisch" />
        <img class="restaurant-logo" src="./assets/logo/logo burger.png.png" alt="BurgerHouse Logo" />
        <div class="restaurant-info">
          <div class="restaurant-title">
            <h1><span>Burger</span>House</h1>
            <span class="rating">
              <span class="rating-star">★</span>
              <span class="rating-score">4,1</span>
              <span class="rating-count">(317)</span>
            </span>
          </div>  
          <p>Das Beste aus Burgern, Pizza und Salaten an einem Ort.</p>
        </div>
      </section>
      <div class="page-layout">
        <section class="menu-content" id="menuContent"></section>
        <aside class="basket desktop-basket hidden" id="basketPanel" aria-label="Warenkorb">
          <button class="close-button" type="button" onclick="closeBasketDialog()" aria-label="Warenkorb schließen">×</button>
          <div id="desktopBasket"></div>
        </aside>
      </div>
    </main>
    <nav class="mobile-basket-button" aria-label="Mobile Navigation">
      <button class="mobile-nav-item" type="button" aria-label="Startseite">
        <img src="./assets/logo/Property 1=default (2).png" alt="" />
      </button>
      <button class="mobile-nav-item" type="button" aria-label="Profil">
        <img src="./assets/logo/Property 1=default (5).png" alt="" />
      </button>
      <button class="mobile-nav-item" type="button" aria-label="Bestellungen">
        <img src="./assets/logo/Property 1=default (4).png" alt="" />
      </button>
      <button class="mobile-nav-item mobile-nav-item--basket" id="openBasketButton" type="button" aria-label="Warenkorb öffnen">
        <img src="./assets/logo/Property 1=default (3).png" alt="" />
        <strong id="mobileBasketTotal">0,00€</strong>
      </button>
    </nav>

    <div class="dialog-backdrop hidden" id="basketDialog">
      <aside class="basket mobile-basket" aria-label="Mobiler Warenkorb">
        <button class="close-button" id="closeBasketButton" type="button" aria-label="Warenkorb schließen">×</button>
        <div id="mobileBasket"></div>
      </aside>
    </div>

    <div class="dialog-backdrop hidden" id="confirmationDialog">
      <div class="confirmation">
        <button class="close-button" id="closeConfirmationButton" type="button" aria-label="Meldung schließen">×</button>
        <div class="confirmation-truck-track" aria-hidden="true">
          <img
            class="confirmation-truck"
            src="./assets/logo/390482e1a64bffed0bc1416df77319027c50bba3.png"
            alt=""
          />
        </div>
        <h2>Bestellung abgeschickt!</h2>
        <p>Dein Essen ist unterwegs!</p>
      </div>
    </div>

    <footer class="footer">
      <span>© 2026 BurgerHouse</span>
      <a href="#">Impressum</a>
      <a href="#">Cookie-Einstellungen</a>
    </footer>

</body>
</html>
